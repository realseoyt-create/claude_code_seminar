  section: ''
  title: ''
  subtitle: 추상화의 역사 — 1단계
  cols:
  - label: 기계어
    code: '01001000 01100101

      01101100 01101100

      01101111 00000000'
    dark: false
  - title: C 언어
    body: '"기계를 직접 다루지 않으면\n개발자가 아니다"'
    dark: false
  highlight: ''
  page_num: 5
