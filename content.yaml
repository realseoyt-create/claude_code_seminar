  section: ''
  title: ''
  subtitle: 추상화의 역사 — 2단계
  cols:
  - label: C
    code: '<strike>ptr = malloc(size);</strike>

      <strike>// ... use ptr ...</strike>

      <strike>free(ptr);</strike>'
    dark: false
  - label: Java
    code: 'Object obj = new Object();

      // ... use obj ...

      // GC handles cleanup'
    dark: false
  highlight: '"메모리 직접 관리 안 하면 개발이 아니다"'
