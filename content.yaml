    body: 맨 앞의 사람들조차 같은 피로 — 다른 점은 "더 빨리" 대신 "무엇을 남길지 고르기"에 시간 투자
    dark: false
- type: cards3
  section: SECTION 9
  title: 증폭되는 경험 — 세 개의 증언
  subtitle: 50년 넘게 코드를 쓴 사람, 최전선에 있는 사람, 업계의 대부 — 세 사람이 거의 **같은 말**을 한다.
  page_num: 85
  cards:
  - label: KENT BECK
    title: TDD 창시자 · 52년
    body: '"프로그래밍은 여전히 프로그래밍이다. 어떤 면에서는 훨씬 더 나은 경험이다. 시간당 더 **중요한 결정을** 내리게 된다."'
    dark: false
  - label: SIMON WILLISON
    title: Vibe Engineering
    body: '"AI는 **기존 전문성을 증폭**시킨다. 더 많은 기술과 경험을 가질수록 LLM으로부터 더 빠르고 더 좋은 결과를 얻는다."'
    dark: false
  - label: MARTIN FOWLER
    title: Thoughtworks
    body: '"AI는 주니어의 산출물은 복제할 수 있지만, **시니어의 경험과 판단은 복제할 수 없다.**"'
    dark: false
  note: '**AI 시대의 경험 — 축소가 아니라 증폭**

    Spec-first · TDD · Plan-Critic · 검증 분리 — 시니어가 원래 하던 것. AI는 그걸 할 줄 아는 사람에게 주는 레버리지'
