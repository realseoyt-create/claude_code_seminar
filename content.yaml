  card: '"이 함수를 리팩토링하고 테스트를 작성해줘"'
  subtitle: '"이건 진짜 개발이 아니다"'
  body: ''
- type: quote
  card: 매번 틀렸다
- type: stats
  section: SECTION 1
  title: 숫자로 보는 변화
  page_num: 10
  items:
  - value: 25%
    text: 'YC 2025 겨울 배치 중

      코드베이스의 **95%를 AI로 생성**'
  - value: ~3개월
    text: 'Meta 엔지니어가 코드를

      **직접 타이핑하지 않은** 기간'
  - value: 100%
    text: 'AI가 짠 코드가 사람의 터치 없이

      **PR에 그대로 올라오는 일상**'
- type: grid
  section: SECTION 1
  title: 마크다운이 코드를 대체하는 현실
  subtitle: 이름은 다르지만 역할은 동일 — 마크다운으로 프로젝트 규칙을 AI에게 전달
  page_num: 11
  cards:
  - title: Claude Code
    body: CLAUDE.md
    dark: false
  - title: Cursor
    body: Cursor Rules
    dark: false
  - title: GitHub Copilot
    body: copilot-instructions.md
    dark: false
  - title: Codex
    body: AGENTS.md
    dark: false
- type: flow
  section: SECTION 1
  title: 개발자의 새로운 역할
  page_num: 12
  flow:
  - text: 코드를 잘 짜는 능력
    highlight: false
  - text: 문서를 잘 쓰는 능력
    highlight: false
  - text: 컨텍스트를 설계하는 능력
    highlight: true
  sidebar:
  - title: 건축가
    accent: false
    body: '벽돌 쌓기 대신 설계도 작성.

      정확한 설계도 → 튼튼한 건물.'
  - title: 오케스트라 지휘자
    accent: false
    body: '직접 연주 대신 전체 조율.

      CLAUDE.md = 총보'
- type: compare
  section: SECTION 1
  title: 그래도 기초는 중요하다
  subtitle: '"AI가 더 많이 해줄수록, 기초 지식을 가진 사람의 경쟁력이 역설적으로 올라간다"'
  page_num: 13
  cols:
  - label: 변하는 것
    title: 직접 코드를 타이핑하는 비중
    body: 데모까지는 쉽지만, 실서비스로 만드는 건 전혀 다른 레벨
    dark: false
  - label: 변하지 않는 것
    title: 시스템을 이해하는 능력
    body: '보안 · 동시접속 · DB 스키마 · 캐싱

      기본기 없이는 질문조차 불가'
    dark: false
- type: chapter
  number: '02'
  title: 왜 Claude Code인가
- type: cards3
  section: SECTION 2
  title: AI 코딩 도구의 진화 3단계
  page_num: 15
  cards:
  - label: 1단계
    title: 자동완성
    body: 'IDE가 다음 줄을 예측

      반복 패턴에 탁월'
    limit: '한계: 현재 파일로 컨텍스트 제한'
    dark: false
  - label: 2단계
    title: 대화형 채팅
    body: '코드 토론, 버그 설명

      스니펫 붙여넣기'
    limit: '한계: 다중 파일 조율이 수동'
    dark: false
  - label: 3단계
    title: 에이전틱 코딩
    body: '목표를 분해하고 독립 실행

      전체 코드베이스 이해'
    current: ← 지금 여기
    dark: true
- type: compare
  section: SECTION 2
  title: 개발 패러다임 전환
  page_num: 16
  cols:
  - label: 기존 개발
    title: 코드 작성
    body: '테스트 · 오류 · 수정

      반복...


      인간이 **모든 단계를 직접** 수행'
    dark: false
  - label: 에이전틱 개발
    title: 목표 정의
    body: '에이전트가 실행

      **변경 검토 · 승인**


      인간은 **의도와 판단**에 집중'
    dark: true
- type: stats
  section: SECTION 2
  title: 에이전틱 코딩의 실제 성과
  page_num: 17
  items:
  - value: 2주
    text: 'CTO 추정 **4~8개월** 프로젝트를

      에이전틱 코딩으로 완료

      Augment Code + Vertex AI'
  - value: 1~2일
    text: '신규 개발자 온보딩

      기존 **수주~수개월**에서 단축

      첫날부터 의미 있는 기여 가능'
  - value: 복합효과
    text: '불가능하던 작업 실현

      기술 부채 해결 · 즉각 피드백'
- type: table
  section: SECTION 2
  title: AI 코딩 도구 비교
  page_num: 18
  col_widths: 220px 150px 1fr
  columns:
  - 도구
  - 형태
  - 특징
  rows:
  - label: GitHub Copilot
    icon: 🤖
    values:
    - IDE 플러그인
    - 코드 자동완성 중심, 가장 대중적
  - label: Cursor
    icon: 🎯
    values:
    - IDE
    - AI 네이티브 에디터, 에이전틱 기능 내장
  - label: Windsurf
    icon: 🌊
    values:
    - IDE
    - 에이전틱 IDE, Cascade 에이전트
  - label: Codex (OpenAI)
    icon: ⚡
    values:
    - 터미널 CLI
    - 에이전틱, 로컬 실행, 확장 레이어 구조
  - label: '**Claude Code**'
    icon: ✳
    values:
    - 터미널 CLI
    - 에이전틱, 로컬 실행, 확장 레이어 구조
    highlight: true
- type: cards3
  section: SECTION 2
  title: 에이전트 루프
  subtitle: 목표만 주면 작업 완료까지 알아서 반복. 언제든 중단하여 방향 수정 가능.
  page_num: 19
  cards:
  - label: '1'
    title: 컨텍스트 수집
    body: '파일 검색, 코드 구조 파악

      설정 파일 읽기, 의존성 매핑'
    dark: false
  - label: '2'
    title: 작업 수행
    body: '파일 편집, 셸 명령 실행

      새 파일 생성'
    dark: false
  - label: '3'
    title: 결과 검증
    body: '테스트 실행, 빌드 확인

      오류 시 1로 복귀'
    dark: true
- type: list-rows
  section: SECTION 2
  title: 내장 도구 — 5가지 범주, 20개+
  page_num: 20
  rows:
  - label: 파일 작업
    desc: 파일 읽기, 코드 편집, 새 파일 생성, 이름 변경 및 재구성
  - label: 검색
    desc: 패턴으로 파일 찾기, 정규식으로 콘텐츠 검색, 코드베이스 탐색
  - label: 실행
    desc: 셸 명령 실행, 서버 시작, 테스트 실행, git 사용
  - label: 웹
    desc: 웹 검색, 문서 가져오기, 오류 메시지 조회
  - label: '**코드 인텔리전스**'
    desc: 타입 오류/경고 확인, 정의로 이동, 참조 찾기
- type: list-rows
  section: SECTION 2
  title: 확장 레이어 구조
  subtitle: CLAUDE.md만으로 시작. 필요에 따라 하나씩 추가.
  page_num: 21
  rows:
  - label: 기초 · CLAUDE.md
    desc: 모든 세션에서 로드되는 프로젝트 컨텍스트
  - label: 자동화 · Skills
    desc: 재사용 가능한 워크플로우
  - label: 자동화 · Hooks
    desc: 이벤트 기반 자동 실행
  - label: 연결 · MCP
    desc: 외부 서비스 통합 — Notion, GitHub, Slack 등 100개+
  - label: 확장 · Subagents
    desc: 격리된 병렬 작업
  - label: 확장 · Agent Teams
    desc: 독립 세션 협업
  - label: 확장 · Plugins
    desc: 패키징 · 배포
- type: cards3
  section: SECTION 2
  title: Claude Code 생태계
  subtitle: 도구 자체보다 **주변 생태계**가 더 빠르게 커지는 중.
  page_num: 22
  cards:
  - label: 공식 확장 포인트
    title: 스킬 · 플러그인 · MCP · 훅
    body: 'Anthropic이 직접 설계한 확장 축 4종.

      공식 문서·마켓 제공.'
    dark: false
  - label: 오픈소스 커뮤니티
    title: awesome-claude-code
    body: GitHub 기반 플러그인·스킬·워크플로우 모음. 레포·디스코드 활발.
    dark: false
  - label: 한국 커뮤니티
    title: 블로그 · 영상 · 세미나
    body: 한글 자료와 실무 사례가 빠르게 누적. 전사 도입에 필수 조건.
    dark: true
- type: quote
  card: '도구의 기능 → 시간이 지나면 추격 가능.

    **커뮤니티가 만든 플러그인·스킬·노하우·교육 자료 → 복제 불가.**'
  subtitle: '문제가 생겼을 때 검색하면 답이 나오는 환경

    = **실무 도입의 핵심 조건**'
  body: 왜 생태계가 중요한가
- type: chapter
  number: '03'
  title: 'AI 시대의

    개발 방법론'
- type: compare
  section: SECTION 3
  title: 왜 방법론이 필요한가
  subtitle: 에이전틱 코딩 등장 → 병목의 이동.
  page_num: 25
  cols:
  - label: 이전의 병목
    title: 코드를 작성하는 것
    dark: false
  - label: 지금의 병목
    title: 'AI에게 **무엇을** 시킬지 정하는 것

      + 정말 원하는 대로 했는지 **확인**하는 것'
    dark: true
- type: table
  section: SECTION 3
  title: 타임라인
  page_num: 26
  col_widths: 130px 1fr
  columns:
  - 시기
  - 사건
  rows:
  - label: '2025.02'
    values:
    - Karpathy, "Vibe Coding" 제시 — AI 코딩의 대중화, 문화적 전환점
  - label: 2025 중반
    values:
    - AI 생성 코드의 품질/보안 문제 부각 — 구조화된 방법론의 필요성 대두
  - label: 2025 하반기
    values:
    - SDD, 스펙 주도 프레임워크 등장 — Vibe Coding의 한계에 대한 업계 대응
  - label: 2026 초
    values:
    - TDD, Context Engineering 부상 — 성숙한 AI 개발 워크플로우의 정립
    highlight: true
- type: compare
  section: SECTION 3
  title: 구조화 수준 스펙트럼
  page_num: 27
  cols:
  - label: 자유
    title: TDD
    body: '테스트 주도


      **검증**'
    dark: false
  - label: 엄격
    title: SDD
    body: '스펙 주도


      **계획**'
    dark: true
- type: compare
  section: SECTION 3
  title: TDD (Test-Driven Development)
  subtitle: '**테스트를 먼저 쓰고, 통과하는 코드를 나중에 쓴다.** AI 시대에는 인간이 테스트, AI가 구현.'
  page_num: 28
  cols:
  - label: ''
    bullets:
    - '**1. 인간이 실패 테스트 작성 (Red)**'
    - 2. AI가 통과 코드 구현 (Green)
    - 3. 인간이 리뷰 → AI가 리팩토링
    - 버그 **40~80%** 감소 — 2025 DORA
    dark: true
  - label: ''
    left_borders:
    - title: 왜 AI에게 특히 중요한가
      body: AI는 "동작하는 것 같은" 코드를 자신 있게 만듦.\n테스트 없으면 **맞는지 틀린지 확인 불가.**
    - title: AI의 치팅에 주의
      body: '테스트 삭제 · 구현 먼저 작성 · assert 약화

        → **테스트 수정 금지 규칙 필수**'
    dark: false
- type: compare
  section: SECTION 3
  title: TDD 예시
  subtitle: 테스트를 먼저 쓰고, 통과하는 코드를 나중에 — AI 시대에도 원칙은 동일
  page_num: 29
  cols:
  - label: ''
    left_borders:
    - title: '"사용자가 운동 페이지에서 과거 운동 클릭 시 상세 보기를 볼 수 있어야 한다"'
    - title: '**RED** — 인간이 실패하는 테스트 작성'
    - title: '**GREEN** — AI가 최소 코드로 통과'
    - title: '**REFACTOR** — 인간 리뷰 후 AI가 정리'
    dark: false
  - label: ''
    left_borders:
    - title: AI 치팅 3대 패턴
      body: '· 테스트 삭제/skip으로 통과

        · assert 약화 (값 → 타입 검증)

        · 구현 먼저, 거기 맞춘 테스트'
    - title: CLAUDE.md 필수 규칙
      body: '**테스트 수정 금지**

        RED 실패 확인 전 GREEN 진행 금지

        구조 변경과 기능 변경 커밋 분리'
    dark: false
- type: grid
  section: SECTION 3
  title: SDD (Spec-Driven Development)
  subtitle: '**코드가 아닌 스펙이 진실의 원천.** 무엇을(WHAT) 먼저 정의하고, 어떻게(HOW)는 AI에게.'
  page_num: 30
  cards:
  - title: 1. SPECIFY — 인간이 "무엇을" 정의
    body: 요구사항 · 수용 기준 · 제약조건
    dark: true
  - label: 언제 쓰나
    body: '· 신규 기능 · 대규모 설계

      · 여러 세션에 걸친 작업

      · 팀 협업 (스펙 = 커뮤니케이션)'
    dark: false
  - title: 2. PLAN — AI가 "어떻게" 제안
    body: 기술 스택 · 아키텍처 → 인간 승인
    dark: false
  - label: 핵심
    body: '각 단계가 **파일로 저장 · 커밋 · 참조**

      → 컨텍스트 소실 방어의 정석'
    dark: true
  - title: 3. TASKS — 분해 후 병렬 실행
    body: 작업↔요구사항 매핑 유지
    dark: false
  full_card:
    text: 모호한 부분 → `[NEEDS CLARIFICATION]` 마커로 구현 중단
    border: true
- type: compare
